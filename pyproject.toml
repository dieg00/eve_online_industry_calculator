[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eveindustry"
version = "0.1.0"
description = "Calculadora make-or-buy de margenes de industria de EVE Online"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
scripts = ["requests>=2.31"]   # solo para scripts/build_*.py (fuera del motor)

[project.scripts]
eveindustry = "eveindustry.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["eveindustry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
