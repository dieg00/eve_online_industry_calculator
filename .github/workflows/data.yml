name: build-data

# Vuelca precios (ESI + Jita) e índices de coste (ESI) a JSON estáticos y los
# publica en la rama `data`. El frontend (Vercel) consume esa rama; los precios
# nunca se piden en el request del usuario.

on:
  schedule:
    - cron: "17 5 * * *"      # a diario ~05:17 UTC
  workflow_dispatch: {}        # y a mano cuando haga falta

permissions:
  contents: write

concurrency:
  group: build-data
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar deps de scripts
        run: pip install requests

      - name: Índices de coste (ESI /industry/systems/)
        run: python scripts/build_indices.py --out out/indices.json

      - name: Precios (ESI /markets/prices/ + agregados de Jita)
        run: python scripts/build_prices.py --types data/types.json --out out/prices.json

      - name: Publicar en la rama data
        run: |
          set -euo pipefail
          test -s out/indices.json
          test -s out/prices.json

          # La rama `data` es un snapshot desechable: un commit huérfano con solo
          # los dos JSON, force-push cada vez. Evita el conflicto nombre-fichero
          # vs nombre-rama (`git checkout data` con el dir data/ presente).
          tmp="$(mktemp -d)"
          cp out/indices.json out/prices.json "$tmp/"

          # index vacío, todo pasa a untracked; solo añadimos los 2 ficheros.
          git switch --orphan data
          mkdir -p data
          cp "$tmp/indices.json" "$tmp/prices.json" data/
          git add -f data/indices.json data/prices.json

          git -c user.name=data-bot -c user.email=data-bot@users.noreply.github.com \
            commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin data
